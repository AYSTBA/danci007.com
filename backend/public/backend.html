<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词突击007 - 后端服务</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0a0a0a; color: #e0e0e0; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(34,197,94,0.06) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 50%, rgba(34,197,94,0.04) 0%, transparent 60%);
}
.container { text-align: center; padding: 40px 24px; max-width: 600px; }
.badge {
  display: inline-block; padding: 6px 16px; border-radius: 20px;
  background: rgba(34,197,94,0.12); color: #4ade80;
  font-size: 13px; letter-spacing: 2px; margin-bottom: 28px;
  border: 1px solid rgba(34,197,94,0.2);
}
h1 {
  font-size: clamp(32px, 6vw, 52px); font-weight: 700; color: #fff;
  margin-bottom: 14px; letter-spacing: 2px;
}
p.desc { font-size: clamp(15px, 2.5vw, 18px); color: rgba(255,255,255,0.5); margin-bottom: 40px; line-height: 1.7; }
.links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 44px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 13px 32px; border-radius: 10px; font-size: 16px; font-weight: 600;
  text-decoration: none; transition: all 0.25s ease; cursor: pointer;
}
.btn-primary {
  background: #22c55e; color: #fff; box-shadow: 0 4px 20px rgba(34,197,94,0.3);
}
.btn-primary:hover { background: #16a34a; transform: translateY(-2px); box-shadow: 0 6px 28px rgba(34,197,94,0.4); }
.btn-outline {
  background: transparent; color: #22c55e; border: 1.5px solid rgba(34,197,94,0.4);
}
.btn-outline:hover { border-color: #22c55e; background: rgba(34,197,94,0.08); transform: translateY(-2px); }
.info { font-size: 14px; color: rgba(255,255,255,0.3); }
.info a { color: rgba(255,255,255,0.45); text-decoration: none; }
.info a:hover { color: #4ade80; }
.info span { margin: 0 8px; }
.divider { width: 40px; height: 2px; background: rgba(34,197,94,0.3); margin: 0 auto 28px; border-radius: 1px; }
</style>
</head>
<body>
<div class="container">
  <div class="badge">BACKEND SERVICE</div>
  <h1>你现在是在后端页面</h1>
  <p class="desc">这里是 单词突击007 的后端 API 服务端口<br>如需访问前端界面，请点击下方按钮跳转</p>
  <div class="divider"></div>
  <div class="links">
    <a href="http://localhost:80" class="btn btn-primary">跳到前端 &rarr;</a>
    <a href="/docs" class="btn btn-outline">查看 API 文档</a>
  </div>
  <div class="info">
    后端端口 3001 <span>|</span> 前端端口 80 <span>|</span> <a href="/admin">管理后台</a>
  </div>
</div>
</body>
</html>
