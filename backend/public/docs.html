<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 文档 - 单词突击007</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --text-muted: #8b949e; --accent: #22c55e; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar .logo { font-weight: 700; font-size: 16px; color: var(--accent); }
.topbar .nav-links { display: flex; gap: 16px; }
.topbar .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color .2s; }
.topbar .nav-links a:hover { color: var(--accent); }
.container { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }

/* markdown rendered styles */
#content h1 { font-size: 2em; margin: 0 0 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); color: #fff; }
#content h2 { font-size: 1.5em; margin: 40px 0 14px; color: #fff; }
#content h3 { font-size: 1.2em; margin: 28px 0 10px; color: #f0f6fc; }
#content p { margin: 10px 0; color: var(--text); }
#content a { color: #58a6ff; text-decoration: none; }
#content a:hover { text-decoration: underline; }
#content pre {
  background: var(--surface) !important; border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; overflow-x: auto; margin: 14px 0;
  font-size: 14px; line-height: 1.5;
}
#content code {
  font-family: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
  font-size: 0.9em;
}
#content :not(pre) > code {
  background: rgba(56,139,253,0.12); color: #58a6ff;
  padding: 2px 6px; border-radius: 4px; font-size: 0.85em;
}
#content blockquote {
  border-left: 3px solid var(--accent); padding: 8px 16px; margin: 14px 0;
  background: rgba(34,197,94,0.05); border-radius: 0 6px 6px 0;
  color: var(--text-muted);
}
#content blockquote p { margin: 4px 0; }
#content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
#content ul, #content ol { padding-left: 24px; margin: 10px 0; }
#content li { margin: 4px 0; }
#content table { width: 100%; border-collapse: collapse; margin: 14px 0; }
#content th, #content td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; font-size: 14px; }
#content th { background: var(--surface); font-weight: 600; color: #fff; }
#content img { max-width: 100%; border-radius: 6px; }
#content strong { color: #fff; }

/* loading */
#loading { text-align: center; padding: 80px 0; color: var(--text-muted); }
#loading .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">📘 单词突击007</div>
  <div class="nav-links">
    <a href="/">后端首页</a>
    <a href="http://localhost:80">前端首页</a>
    <a href="/admin">管理后台</a>
  </div>
</div>
<div class="container">
  <div id="loading"><div class="spinner"></div>加载文档中...</div>
  <div id="content" style="display:none"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
marked.setOptions({
  breaks: true, gfm: true,
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, { language: lang }).value; } catch {}
    }
    return code;
  }
});
fetch('/docs/api.md')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
    document.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  })
  .catch(err => {
    document.getElementById('loading').innerHTML = '<p style="color:#f85149">加载失败: ' + err.message + '</p><p style="margin-top:12px;font-size:14px">请刷新重试</p>';
  });
</script>
</body>
</html>
